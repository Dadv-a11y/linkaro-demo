<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Linkaro : questionnaire de cadrage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #07080d;
        --fg: #eef0f7;
        --mut: #9aa0b8;
        --card: #11131c;
        --line: #282b3d;
        --a: #2ee6d2;
        --b: #8b6cff;
        --on: #04110f;
        --err: #ff7a8a;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          --bg: #f5f6fb;
          --fg: #12142a;
          --mut: #5b6078;
          --card: #fff;
          --line: #d5d9e8;
          --a: #0b8f83;
          --b: #5b3fd6;
          --on: #fff;
          --err: #c0223b;
        }
      }
      :root[data-theme="light"] {
        --bg: #f5f6fb;
        --fg: #12142a;
        --mut: #5b6078;
        --card: #fff;
        --line: #d5d9e8;
        --a: #0b8f83;
        --b: #5b3fd6;
        --on: #fff;
        --err: #c0223b;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 70px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          400 16px/1.55 "Bricolage Grotesque",
          system-ui,
          sans-serif;
      }
      [hidden] {
        display: none !important;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 20px;
        background: var(--bg);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 800;
        font-size: 19px;
        letter-spacing: -0.02em;
      }
      .logo-mark {
        width: 32px;
        height: 32px;
        flex: none;
        color: var(--a);
      }
      #pt {
        font-size: 14px;
        color: var(--mut);
      }
      .bar {
        height: 3px;
        background: var(--line);
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--a), var(--b));
        transition: width 0.4s;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 28px 20px 60px;
      }
      main.in {
        animation: f 0.35s ease-out;
      }
      @keyframes f {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      h1 {
        font-size: clamp(32px, 8vw, 48px);
        line-height: 1.05;
        letter-spacing: -0.03em;
        font-weight: 800;
        margin: 0.4em 0;
      }
      h2 {
        font-size: 28px;
        letter-spacing: -0.02em;
        font-weight: 800;
        margin: 0 0 6px;
      }
      .lead {
        font-size: 18px;
      }
      .mut {
        color: var(--mut);
      }
      .rings {
        position: relative;
        height: 70px;
        width: 130px;
        margin: 20px 0 10px;
      }
      .rings i {
        position: absolute;
        top: 0;
        width: 80px;
        height: 60px;
        border-radius: 40px;
        border: 8px solid var(--a);
      }
      .rings i + i {
        left: 50px;
        top: 10px;
        border-color: var(--b);
        mix-blend-mode: screen;
      }
      .q {
        border: 0;
        padding: 0;
        margin: 34px 0 0;
        min-width: 0;
      }
      legend {
        padding: 0;
        font-size: 19px;
        font-weight: 600;
        line-height: 1.35;
        margin-bottom: 4px;
      }
      .hint {
        margin: 0 0 12px;
        font-size: 14px;
        color: var(--mut);
      }
      .quote {
        margin: 0 0 14px;
        padding: 12px 16px;
        border-left: 3px solid var(--b);
        background: var(--card);
        border-radius: 0 10px 10px 0;
        font-style: italic;
      }
      .opts {
        display: grid;
        gap: 8px;
      }
      .o {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 12px 14px;
        border: 1.5px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .o input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .o span::before {
        content: "";
        float: left;
        width: 20px;
        height: 20px;
        margin: 1px 12px 0 0;
        border: 2px solid var(--mut);
        border-radius: 6px;
        transition: 0.15s;
      }
      .r span::before {
        border-radius: 50%;
      }
      .o:has(input:checked) {
        border-color: var(--a);
        background: color-mix(in srgb, var(--a) 12%, var(--card));
      }
      .o:has(input:checked) span::before {
        border-color: var(--a);
        background: var(--a);
        box-shadow: inset 0 0 0 4px var(--card);
      }
      .o:has(input:disabled) {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .o:has(input:focus-visible) {
        outline: 2px solid var(--b);
        outline-offset: 2px;
      }
      textarea,
      .oth {
        width: 100%;
        font: inherit;
        color: var(--fg);
        background: var(--card);
        border: 1.5px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        resize: vertical;
      }
      .oth {
        margin-top: 8px;
      }
      textarea:focus,
      .oth:focus {
        outline: 2px solid var(--b);
        outline-offset: 1px;
      }
      .err {
        margin: 8px 0 0;
        min-height: 1em;
        font-size: 14px;
        color: var(--err);
      }
      .nav {
        display: flex;
        gap: 12px;
        justify-content: space-between;
        margin-top: 40px;
      }
      .btn {
        font: 600 16px inherit;
        font-family: inherit;
        padding: 14px 26px;
        border-radius: 12px;
        border: 0;
        background: var(--a);
        color: var(--on);
        cursor: pointer;
      }
      .btn.ghost {
        background: transparent;
        color: var(--fg);
        border: 1.5px solid var(--line);
      }
      .btn:focus-visible {
        outline: 2px solid var(--b);
        outline-offset: 2px;
      }
      .nav .btn:only-child {
        margin-left: auto;
      }
      details {
        margin-top: 28px;
        border: 1.5px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        background: var(--card);
      }
      pre {
        max-width: 100%;
        overflow-x: auto;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .hr {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .lang {
        font: 600 13px inherit;
        font-family: inherit;
        color: var(--fg);
        background: transparent;
        border: 1.5px solid var(--line);
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .lang:focus-visible {
        outline: 2px solid var(--b);
        outline-offset: 2px;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <input type="hidden" id="empreinte-ip-ua" name="empreinte_ip_ua_sha256" />
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="g" viewBox="0 0 32 32">
        <path
          d="M25 7.5A12 12 0 1 0 25 24.5"
          fill="none"
          stroke="currentColor"
          stroke-width="3.4"
          stroke-linecap="round"
        />
        <rect
          x="11"
          y="11"
          width="11"
          height="10"
          rx="5"
          transform="rotate(-38 16 16)"
          fill="none"
          stroke="currentColor"
          stroke-width="2.6"
        />
      </symbol>
    </svg>
    <header>
      <b class="logo"
        ><svg class="logo-mark" aria-hidden="true"><use href="#g"></use></svg
        >Linkaro</b
      ><span class="hr"
        ><span id="pt"></span
        ><button class="lang" id="lang" type="button">EN</button></span
      >
    </header>
    <div class="bar"><i id="pb"></i></div>
    <main id="app"></main>
    <script>
      // Renseigner ici l'URL de réception (Google Apps Script, Formspree, API Nexa...) quand le formulaire est hébergé hors claude.ai.
      const ENDPOINT =
        "https://formsubmit.co/ajax/e6cedaa646a5dd096660cf87bad253c";
      const VERSION = 2;
      const M = "multi",
        U = "single",
        T = "text";
      // o(code, libellé FR, libellé EN, exclusif?) — le code est stable quelle que soit la langue.
      const o = (v, fr, en, ex) => ({ v, fr, en: en || fr, ex: !!ex });
      const q = (id, fr, en, type, opts, x) =>
        Object.assign({ id, fr, en, type, opts: opts || [] }, x);
      const has = (E, id, ...v) => [].concat(E[id] || []).some((x) => v.includes(x));
      const collab = (E) => has(E, "c1", "plusieurs", "peu");
      const paid = (E) => collab(E) && has(E, "c4", "argent");
      const nsp = o("nsp", "Je ne sais pas", "I don't know");

      const S = [
        {
          fr: "Vous et votre activité",
          en: "You and your content",
          q: [
            q("p1", "Quel âge avez-vous ?", "How old are you?", U, [
              o("m18", "Moins de 18 ans", "Under 18"),
              o("18_20", "18 – 20 ans", "18 – 20"),
              o("21_24", "21 – 24 ans", "21 – 24"),
              o("25_34", "25 – 34 ans", "25 – 34"),
              o("35p", "35 ans ou plus", "35 or older"),
            ]),
            q("p2", "Dans quel pays vivez-vous ?", "Which country do you live in?", U, [
              o("cm", "Cameroun", "Cameroon"),
              o("ci", "Côte d'Ivoire"),
              o("sn", "Sénégal", "Senegal"),
              o("ga", "Gabon"),
              o("ng", "Nigeria"),
            ], { other: 1 }),
            q("a1", "Sur quelles plateformes publiez-vous ?", "Which platforms do you post on?", M, [
              o("tiktok", "TikTok"),
              o("facebook", "Facebook"),
              o("instagram", "Instagram"),
              o("youtube", "YouTube"),
              o("snapchat", "Snapchat"),
              o("x", "X (Twitter)"),
              o("whatsapp", "Statuts / chaîne WhatsApp", "WhatsApp status / channel"),
            ], { other: 1 }),
            q("a2", "Laquelle est votre plateforme principale ?", "Which one is your main platform?", U, [], { from: "a1" }),
            q("a3", "Combien d'abonnés avez-vous sur votre plateforme principale ?", "How many followers do you have on your main platform?", U, [
              o("lt1k", "Moins de 1 000", "Under 1,000"),
              o("1_10k", "1 000 – 10 000"),
              o("10_50k", "10 000 – 50 000"),
              o("50_250k", "50 000 – 250 000"),
              o("250k_1m", "250 000 – 1 million"),
              o("gt1m", "Plus de 1 million", "Over 1 million"),
              nsp,
            ]),
            q("a4", "Comment décririez-vous votre activité aujourd'hui ?", "How would you describe your activity today?", U, [
              o("loisir", "C'est surtout un loisir", "It's mostly a hobby"),
              o("serieux", "Je crée sérieusement mais ce n'est pas encore une activité professionnelle", "I create seriously but it's not a business yet"),
              o("transition", "Je suis en train de passer progressivement à une activité professionnelle", "I'm gradually turning it into a business"),
              o("revenu", "Cela me rapporte déjà de l'argent", "It already earns me money"),
              o("principal", "C'est mon activité professionnelle principale", "It's my main job"),
            ]),
            q("a5", "Quels sont vos thèmes principaux ?", "What are your main topics?", M, [
              o("humour", "Humour / sketchs", "Comedy / skits"),
              o("beaute", "Beauté / mode", "Beauty / fashion"),
              o("cuisine", "Cuisine", "Food"),
              o("lifestyle", "Lifestyle / vie quotidienne", "Lifestyle / daily life"),
              o("musique", "Musique / danse", "Music / dance"),
              o("tech", "Tech / téléphones", "Tech / phones"),
              o("sport", "Sport / bien-être", "Sports / wellness"),
              o("education", "Éducation / conseils", "Education / tips"),
              o("business", "Business / argent", "Business / money"),
              o("voyage", "Voyage / tourisme", "Travel / tourism"),
              o("gaming", "Jeux vidéo", "Gaming"),
              o("famille", "Famille / parentalité", "Family / parenting"),
            ], { other: 1, max: 3 }),
            q("a6", "Vos revenus liés à la création de contenu viennent principalement de :", "Your content-related income mainly comes from:", M, [
              o("marques", "Collaborations avec des marques", "Brand collaborations"),
              o("plateformes", "Publicité / revenus des plateformes", "Ads / platform payouts"),
              o("vente", "Vente de mes propres produits ou services", "Selling my own products or services"),
              o("affiliation", "Affiliation / commissions", "Affiliate / commissions"),
              o("evenements", "Événements / apparitions", "Events / appearances"),
              o("dons", "Dons / soutien de la communauté (cadeaux en live…)", "Donations / community support (live gifts…)"),
              o("aucun", "Je ne gagne pas encore d'argent avec mon contenu", "I don't earn money from my content yet", 1),
            ], { other: 1 }),
            q("a7", "Où se trouve la majorité de votre audience ?", "Where is most of your audience?", U, [
              o("pays", "Dans mon pays", "In my country"),
              o("afrique", "Répartie dans plusieurs pays africains", "Spread across several African countries"),
              o("diaspora", "Surtout à l'étranger / la diaspora", "Mostly abroad / diaspora"),
              nsp,
            ]),
          ],
        },
        {
          fr: "Vos collaborations avec les marques",
          en: "Your brand collaborations",
          q: [
            q("c1", "Avez-vous déjà travaillé avec une marque, une entreprise ou un commerce en tant que créateur ?", "Have you ever worked with a brand, company or business as a creator?", U, [
              o("plusieurs", "Oui, plusieurs fois", "Yes, several times"),
              o("peu", "Oui, une ou deux fois", "Yes, once or twice"),
              o("non", "Non, jamais", "No, never"),
            ]),
            q("c2", "Combien de collaborations avez-vous faites ces 12 derniers mois ?", "How many collaborations did you do in the last 12 months?", U, [
              o("0", "Aucune", "None"),
              o("1_2", "1 – 2"),
              o("3_5", "3 – 5"),
              o("6_10", "6 – 10"),
              o("10p", "Plus de 10", "More than 10"),
            ], { show: collab }),
            q("c3", "Comment ces collaborations sont-elles généralement arrivées ?", "How did these collaborations usually come about?", M, [
              o("marque", "La marque m'a contacté directement", "The brand contacted me directly"),
              o("moi", "J'ai contacté la marque", "I contacted the brand"),
              o("relation", "Une connaissance m'a mis en relation", "Someone I know connected us"),
              o("agence", "Mon manager ou une agence", "My manager or an agency"),
              o("plateforme", "Via une plateforme spécialisée", "Through a specialised platform"),
            ], { other: 1, show: collab }),
            q("c4", "Qu'avez-vous reçu en échange ?", "What did you receive in return?", M, [
              o("argent", "Un paiement en argent", "A cash payment"),
              o("produits", "Des produits ou services offerts", "Free products or services"),
              o("commission", "Une commission / un code promo sur les ventes", "A commission / promo code on sales"),
              o("visibilite", "Seulement de la visibilité", "Only visibility"),
            ], { show: collab }),
            q("c5", "Comment êtes-vous payé(e) ?", "How do you get paid?", M, [
              o("momo", "MTN Mobile Money"),
              o("om", "Orange Money"),
              o("wave", "Wave"),
              o("especes", "Espèces", "Cash"),
              o("virement", "Virement bancaire", "Bank transfer"),
              o("intl", "PayPal / paiement international", "PayPal / international payment"),
            ], { other: 1, show: paid }),
            q("c6", "Qui gère vos collaborations ?", "Who manages your collaborations?", U, [
              o("seul", "Je gère tout seul(e)", "I handle everything myself"),
              o("proche", "Un proche m'aide", "A friend or relative helps me"),
              o("manager", "Un manager", "A manager"),
              o("agence", "Une agence", "An agency"),
            ], { show: collab }),
            q("c7", "Quelle commission prend votre manager ou agence ?", "What commission does your manager or agency take?", U, [
              o("lt10", "Moins de 10 %", "Less than 10%"),
              o("10_20", "10 – 20 %"),
              o("20_30", "20 – 30 %"),
              o("gt30", "Plus de 30 %", "More than 30%"),
              nsp,
            ], { show: (E) => has(E, "c6", "manager", "agence") }),
            q("c8", "Parmi ces étapes, lesquelles vous posent le plus de difficultés ?", "Which of these steps are the hardest for you?", M, [
              o("trouver", "Trouver des marques intéressées par mon profil", "Finding brands interested in my profile"),
              o("contacter", "Savoir qui contacter", "Knowing who to contact"),
              o("presenter", "Présenter mon profil et mes statistiques", "Presenting my profile and stats"),
              o("prix", "Savoir combien demander", "Knowing how much to charge"),
              o("negocier", "Négocier le prix", "Negotiating the price"),
              o("comprendre", "Comprendre ce que la marque attend réellement", "Understanding what the brand really expects"),
              o("prestation", "Définir ce que comprend ma prestation", "Defining what my service includes"),
              o("organiser", "Organiser le travail et respecter les délais", "Organising the work and meeting deadlines"),
              o("paiement", "Être payé(e) correctement et à temps", "Getting paid correctly and on time"),
              o("suivi", "Faire le suivi après la publication", "Following up after publishing"),
            ], { other: 1, max: 3, show: collab }),
            q("c9", "Qu'est-ce qui vous empêche principalement d'obtenir une collaboration ?", "What mainly prevents you from getting a collaboration?", U, [
              o("quelles", "Je ne sais pas quelles marques contacter", "I don't know which brands to contact"),
              o("approcher", "Je ne sais pas comment les approcher", "I don't know how to approach them"),
              o("prix", "Je ne sais pas combien demander", "I don't know how much to charge"),
              o("presenter", "Je ne sais pas comment présenter mon profil", "I don't know how to present my profile"),
              o("visibilite", "Je manque de visibilité auprès des marques", "Brands don't see me"),
              o("audience", "Mon audience n'est pas encore assez développée", "My audience isn't big enough yet"),
              o("desaccord", "Des marques m'ont contacté mais nous ne nous sommes pas mis d'accord", "Brands contacted me but we didn't agree"),
              o("nature", "On me propose surtout des produits, pas d'argent", "I'm mostly offered products, not money"),
              o("fonctionnement", "Je ne sais pas comment fonctionne une collaboration", "I don't know how a collaboration works"),
            ], { other: 1, show: (E) => has(E, "c1", "non") }),
          ],
        },
        {
          fr: "Accords et paiements",
          en: "Agreements and payments",
          q: [
            q("d1", "Signez-vous un contrat avec la marque ?", "Do you sign a contract with the brand?", U, [
              o("toujours", "Toujours", "Always"),
              o("parfois", "Parfois", "Sometimes"),
              o("oral", "Non, accord oral ou par message seulement", "No, only a verbal or chat agreement"),
              o("jamais", "Jamais rien de formel", "Never anything formal"),
            ], { show: collab }),
            q("d2", "Demandez-vous un acompte avant de commencer ?", "Do you ask for a deposit before starting?", U, [
              o("toujours", "Toujours", "Always"),
              o("parfois", "Parfois", "Sometimes"),
              o("jamais", "Jamais", "Never"),
            ], { show: paid }),
            q("d3", "Avez-vous déjà rencontré l'un de ces problèmes de paiement ?", "Have you ever faced any of these payment problems?", M, [
              o("retard", "Paiement en retard", "Late payment"),
              o("moins", "Payé(e) moins que prévu", "Paid less than agreed"),
              o("impaye", "Jamais payé(e)", "Never paid"),
              o("nature", "Payé(e) en produits au lieu de l'argent prévu", "Paid in products instead of the agreed money"),
              o("aucun", "Aucun problème", "No problems", 1),
            ], { show: paid }),
            q("d4", "Sur vos 10 dernières collaborations payées, combien ont posé un problème de paiement ?", "Out of your last 10 paid collaborations, how many had a payment problem?", U, [
              o("1", "1"),
              o("2_3", "2 – 3"),
              o("4_6", "4 – 6"),
              o("7p", "7 ou plus", "7 or more"),
            ], { show: (E) => has(E, "d3", "retard", "moins", "impaye", "nature") }),
            q("d5", "Où se passent vos échanges avec les marques ?", "Where do your conversations with brands take place?", M, [
              o("whatsapp", "WhatsApp"),
              o("messenger", "Messenger"),
              o("telegram", "Telegram"),
              o("dm_ig", "Messages privés Instagram", "Instagram DMs"),
              o("dm_tt", "Messages privés TikTok", "TikTok DMs"),
              o("email", "E-mail", "Email"),
              o("tel", "Appels téléphoniques", "Phone calls"),
              o("presentiel", "En personne", "In person"),
            ], { other: 1, show: collab }),
            q("d6", "Après la publication, envoyez-vous un bilan (vues, likes, captures…) à la marque ?", "After publishing, do you send the brand a report (views, likes, screenshots…)?", U, [
              o("toujours", "Oui, systématiquement", "Yes, every time"),
              o("demande", "Seulement si la marque le demande", "Only if the brand asks"),
              o("non", "Non", "No"),
            ], { show: collab }),
          ],
        },
        {
          fr: "Vos comptes et vos statistiques",
          en: "Your accounts and stats",
          intro: {
            fr: "Ces réponses nous aident à savoir quelles statistiques Linkaro pourra récupérer automatiquement.",
            en: "These answers help us know which stats Linkaro will be able to fetch automatically.",
          },
          q: [
            q("s1", "Votre compte Instagram est :", "Your Instagram account is:", U, [
              o("perso", "Un compte personnel", "A personal account"),
              o("createur", "Un compte créateur", "A creator account"),
              o("entreprise", "Un compte entreprise", "A business account"),
              nsp,

      // --- Moteur de branchement -------------------------------------------
      // Une réponse ne « compte » que si la question est visible compte tenu
      // des réponses effectives qui la précèdent. Ainsi, changer une réponse
      // en amont neutralise automatiquement toutes les réponses qui en dépendaient.
      function optsOf(x, E) {
        if (!x.from) {
          const base = x.opts.slice();
          if (x.other) base.push(o("autre", UI.fr.other, UI.en.other));
          return base;
        }
        const p = Q[x.from],
          sel = [].concat(E[x.from] || []);
        return optsOf(p, E)
          .filter((op) => sel.includes(op.v) && !op.ex)
          .map((op) =>
            op.v == "autre" && (A[x.from + "_autre"] || "").trim()
              ? o("autre", A[x.from + "_autre"].trim(), A[x.from + "_autre"].trim())
              : op,
          );
      }
      function visibleQ(x, E) {
        if (x.show && !x.show(E)) return false;
        if (x.from && optsOf(x, E).length < 2) return false;
        return true;
      }
      function clean(x, v, E) {
        if (x.type == T) return typeof v == "string" && v.trim() ? v : undefined;
        const ok = optsOf(x, E).map((op) => op.v);
        if (x.type == U) return ok.includes(v) ? v : undefined;
        const arr = [].concat(v || []).filter((i) => ok.includes(i));
        return arr.length ? arr : undefined;
      }
      function effective() {
        const E = {};
        ORDER.forEach((id) => {
          const x = Q[id];
          if (!visibleQ(x, E)) return;
          const v = clean(x, A[id], E);
          if (v !== undefined) E[id] = v;
        });
        return E;
      }
      const secVisible = (i, E) => S[i].q.some((x) => visibleQ(x, E));
      function nextSec(from, dir, E) {
        for (let i = from + dir; i >= 0 && i < S.length; i += dir)
          if (secVisible(i, E)) return i;
        return dir > 0 ? S.length : -1;
      }

      // --- Rendu -----------------------------------------------------------
      function qHTML(x, E) {
        const u = ui();
        const hint =
          x.type == T ? u.free : x.type == U ? u.one : x.max ? u.upto(x.max) : u.many;
        const kind = x.type == U ? "radio" : "checkbox",
          cls = x.type == U ? "o r" : "o";
        let b = "";
        if (x.type == T)
          b = x.short
            ? `<input class="oth" type="text" maxlength="120" placeholder="${esc(u.answer)}" value="${esc(A[x.id] || "")}">`
            : `<textarea rows="4" maxlength="800" placeholder="${esc(u.answer)}">${esc(A[x.id] || "")}</textarea>`;
        else {
          const opts = optsOf(x, E)
            .map((op) => {
              const lab = op.v == "autre" && !x.from ? u.other : tx(op);
              return `<label class="${cls}"><input type="${kind}" name="n${x.id}" value="${esc(op.v)}" data-ex="${op.ex ? 1 : 0}"><span>${esc(lab)}</span></label>`;
            })
            .join("");
          const oth = x.other
            ? `<input class="oth" data-other="1" type="text" maxlength="150" placeholder="${esc(u.precise)}" value="${esc(A[x.id + "_autre"] || "")}" hidden>`
            : "";
          b = `<div class="opts">${opts}${oth}</div>`;
        }
        const quote = x.quote ? `<blockquote class="quote">${esc(tx(x.quote))}</blockquote>` : "";
        return `<fieldset class="q" data-id="${x.id}"><legend>${esc(x[L] || x.fr)}</legend><p class="hint">${hint}</p>${quote}${b}<p class="err" aria-live="polite"></p></fieldset>`;
      }
      function refresh(id) {
        const x = Q[id],
          bx = box(id);
        if (!bx || x.type == T) return;
        const v = [].concat(A[id] || []);
        bx.querySelectorAll("input[type=radio],input[type=checkbox]").forEach((i) => {
          i.checked = v.includes(i.value);
          i.disabled = !!x.max && !i.checked && v.length >= x.max;
        });
        const ot = bx.querySelector("[data-other]");
        if (ot) ot.hidden = !v.includes("autre");
      }
      // Met à jour la section affichée : visibilité, et options des questions
      // dont la liste dépend d'une autre réponse (ex. « la plus importante »).
      function sync() {
        const E = effective();
        S[step].q.forEach((x) => {
          let b = box(x.id);
          if (!b) return;
          if (x.from) {
            const sig = optsOf(x, E).map((op) => op.v + ":" + tx(op)).join("|");
            if (b.dataset.sig != sig) {
              b.outerHTML = qHTML(x, E);
              b = box(x.id);
              b.dataset.sig = sig;
              refresh(x.id);
            }
          }
          b.hidden = !visibleQ(x, E);
        });
        head(E);
      }
      function head(E) {
        const u = ui();
        E = E || effective();
        const vis = S.map((_, i) => secVisible(i, E));
        const total = vis.filter(Boolean).length,
          pos = vis.slice(0, Math.max(step + 1, 0)).filter(Boolean).length;
        $("#pt").textContent =
          step >= 0 && step < S.length ? u.sec(pos, total) : step >= S.length ? u.done : "";
        $("#pb").style.width =
          (step < 0 ? 0 : step >= S.length ? 100 : (pos / total) * 100) + "%";
        const lb = $("#lang");
        lb.textContent = u.switchTo;
        lb.setAttribute("aria-label", u.switchLabel);
        document.documentElement.lang = L;
      }
      function render() {
        const u = ui();
        app.classList.remove("in");
        void app.offsetWidth;
        app.classList.add("in");
        window.scrollTo(0, 0);
        if (step < 0) {
          head();
          app.innerHTML = `<div class="rings"><i></i><i></i></div><h1>${u.title}</h1><p class="lead">${u.lead}</p><p class="mut">${u.intro}</p><div class="nav"><button class="btn" id="go">${Object.keys(A).length ? u.resume : u.start}</button></div>`;
          $("#go").onclick = () => {
            step = nextSec(-1, 1, effective());
            sv();
            render();
          };
          return;
        }
        if (step >= S.length) return thanks();
        if (!secVisible(step, effective())) {
          step = nextSec(step, 1, effective());
          if (step >= S.length) step = nextSec(S.length, -1, effective());
        }
        const s = S[step],
          E = effective();
        const isLast = nextSec(step, 1, E) >= S.length;
        app.innerHTML = `<h2>${esc(tx(s))}</h2>${s.intro ? `<p class="mut">${esc(tx(s.intro))}</p>` : ""}${s.q.map((x) => qHTML(x, E)).join("")}<div class="nav"><button class="btn ghost" id="bk">${u.back}</button><button class="btn" id="nx">${isLast ? u.send : u.next}</button></div>`;
        s.q.forEach((x) => refresh(x.id));
        sync();
        $("#bk").onclick = () => {
          step = nextSec(step, -1, effective());
          sv();
          render();
        };
        $("#nx").onclick = () => {
          if (!check()) return;
          const n = nextSec(step, 1, effective());
          if (n >= S.length) submit();
          else {
            step = n;
            sv();
            render();
          }
        };
      }
      $("#lang").onclick = () => {
        L = L == "fr" ? "en" : "fr";
        sv();
        if (step >= S.length) thanks();
        else render();
      };

      app.addEventListener("input", (e) => {
        const t = e.target,
          bx = t.closest(".q");
        if (!bx) return;
        const id = bx.dataset.id;
        if (t.dataset.other) A[id + "_autre"] = t.value;
        else if (t.tagName == "TEXTAREA" || t.type == "text") A[id] = t.value;
        sv();
        if (t.dataset.other && S[step].q.some((x) => x.from == id)) sync();
      });
      app.addEventListener("change", (e) => {
        const t = e.target,
          bx = t.closest(".q");
        if (!bx || t.type == "text") return;
        const id = bx.dataset.id,
          x = Q[id];
        if (x.type == T) return;
        if (x.type == U) A[id] = t.value;
        else {
          let v = [...bx.querySelectorAll("input[type=checkbox]:checked")].map((i) => i.value);
          if (t.checked && t.dataset.ex == "1") v = [t.value];
          else if (t.checked) {
            const ex = optsOf(x, effective()).filter((op) => op.ex).map((op) => op.v);
            v = v.filter((i) => !ex.includes(i));
          }
          A[id] = v;
        }
        bx.querySelector(".err").textContent = "";
        refresh(id);
        sync();
        sv();
        const ot = bx.querySelector("[data-other]");
        if (ot && !ot.hidden && t.value == "autre") ot.focus();
      });
      function check() {
        const u = ui(),
          E = effective();
        let bad = null;
        S[step].q.forEach((x) => {
          const b = box(x.id);
          if (!visibleQ(x, E) || x.type == T) return;
          let m = "";
          if (E[x.id] === undefined) m = u.req;
          else if ([].concat(E[x.id]).includes("autre") && !x.from && !(A[x.id + "_autre"] || "").trim())
            m = u.reqOther;
          b.querySelector(".err").textContent = m;
          if (m && !bad) bad = b;
        });
        if (bad) bad.scrollIntoView({ behavior: "smooth", block: "center" });
        return !bad;
      }

      // --- Envoi -----------------------------------------------------------
      async function hashIpAndUserAgent() {
        if (!window.crypto?.subtle) throw new Error("Web Crypto indisponible");
        const response = await fetch("https://api.ipify.org?format=json");
        if (!response.ok) throw new Error("Adresse IP indisponible");
        const { ip } = await response.json();
        if (!ip) throw new Error("Adresse IP indisponible");
        const data = new TextEncoder().encode(`${ip}|${navigator.userAgent}`);
        const digest = await crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(digest), (byte) =>
          byte.toString(16).padStart(2, "0"),
        ).join("");
      }
      // Libellés envoyés en français pour une analyse homogène, codes en plus.
      function labelFr(x, v, E) {
        const op = optsOf(x, E).find((p) => p.v == v);
        return op ? op.fr : v;
      }
      async function submit() {
        const nx = $("#nx");
        if (nx) {
          nx.disabled = true;
          nx.textContent = ui().sending;
        }
        let empreinte;
        try {
          empreinte = await hashIpAndUserAgent();
        } catch (e) {
          alert(ui().hashErr);
          if (nx) {
            nx.disabled = false;
            nx.textContent = ui().send;
          }
          return;
        }
        $("#empreinte-ip-ua").value = empreinte;
        const E = effective();
        const out = {
          version: VERSION,
          langue: L,
          envoye_le: new Date().toISOString(),
          empreinte_ip_ua_sha256: empreinte,
          reponses: {},
        };
        ORDER.forEach((id) => {
          const x = Q[id];
          if (visibleQ(x, E)) {
            const v = E[id];
            if (v === undefined) return;
            const r = { question: x.fr };
            if (x.type == T) r.reponse = v.trim();
            else {
              r.code = v;
              r.reponse = Array.isArray(v) ? v.map((i) => labelFr(x, i, E)) : labelFr(x, v, E);
              if ([].concat(v).includes("autre") && (A[id + "_autre"] || "").trim() && !x.from)
                r.autre = A[id + "_autre"].trim();
            }
            out.reponses[id] = r;
          } else if (x.from && (!x.show || x.show(E))) {
            // Une seule option possible : la réponse est déduite sans poser la question.
            const only = optsOf(x, E);
            if (only.length == 1)
              out.reponses[id] = { question: x.fr, code: only[0].v, reponse: only[0].fr, deduit: true };
          }
        });
        if (ENDPOINT) {
          try {
            await fetch(ENDPOINT, {
              method: "POST",
              headers: { "Content-Type": "application/json", Accept: "application/json" },
              body: JSON.stringify(out),
            });
          } catch (e) {}
        }
        try {
          const all = JSON.parse(localStorage.getItem("lk2_all") || "[]");
          all.push(out);
          localStorage.setItem("lk2_all", JSON.stringify(all));
          localStorage.removeItem("lk2_a");
          localStorage.removeItem("lk2_s");
        } catch (e) {}
        A = {};
        step = S.length;
        thanks();
      }
      function thanks() {
        const u = ui();
        head();
        window.scrollTo(0, 0);
        app.innerHTML = `<div class="rings"><i></i><i></i></div><h1>${u.thanks}</h1><p class="lead">${u.thanksLead}</p><p class="mut">${u.thanksMut}</p><div class="nav"><button class="btn ghost" id="nw">${u.again}</button></div>`;
        $("#nw").onclick = () => {
          step = -1;
          sv();
          render();
        };
      }
      render();
    </script>
  </body>
</html>
