        opacity: 0;

        height: 20px;
        margin: 1px 12px 0 0;

        border-color: var(--a);

        cursor: not-allowed;

      .o:has(input:focus-visible) {

        outline-offset: 2px;

        font: inherit;
        color: var(--fg);
        background: var(--card);
        border: 1.5px solid var(--line);

        padding: 12px 14px;

      .oth {

      }

        outline: 2px solid var(--b);

      }
      .err {
        margin: 8px 0 0;
        min-height: 1em;
        font-size: 14px;
        color: var(--err);

      .nav {
        display: flex;
        gap: 12px;
        justify-content: space-between;
        margin-top: 40px;
      }
      .btn {
        font: 600 16px inherit;
        font-family: inherit;
        padding: 14px 26px;
        border-radius: 12px;
        border: 0;
        background: var(--a);
        color: var(--on);

      .btn.ghost {
        background: transparent;
        color: var(--fg);

          animation: none !important;
          transition: none !important;

  </head>

        let b = "";
        if (x.type == T)
          b = `<textarea rows="4" maxlength="800" placeholder="Votre réponse">${esc(A[x.id] || "")}</textarea>`;
        else {
          const opts = x.opts
            .map((o) => {
              const ex = o[0] == "!",
                l = ex ? o.slice(1) : o;
              return `<label class="${cls}"><input type="${kind}" name="n${x.id}" value="${esc(l)}" data-ex="${ex ? 1 : 0}"><span>${esc(l)}</span></label>`;
            })
            .join("");
          const oth = x.other
            ? `<label class="${cls}"><input type="${kind}" name="n${x.id}" value="Autre" data-ex="0"><span>Autre</span></label><input class="oth" type="text" maxlength="150" placeholder="Précisez" value="${esc(A[x.id + "_autre"] || "")}" hidden>`
            : "";
          b = `<div class="opts">${opts}${oth}</div>`;
        }
        return `<fieldset class="q" data-id="${x.id}"><legend>${esc(x.t)}</legend><p class="hint">${hint}</p>${x.quote ? `<blockquote class="quote">${esc(x.quote)}</blockquote>` : ""}${b}<p class="err" aria-live="polite"></p></fieldset>`;
      }
      function refresh(id) {
        const x = Q[id],
          bx = box(id);
        if (!bx || x.type == T) return;
        const v = [].concat(A[id] || []);
        bx.querySelectorAll("input[type=radio],input[type=checkbox]").forEach(
          (i) => {
            i.checked = v.includes(i.value);
            i.disabled = !!x.max && !i.checked && v.length >= x.max;
          },
        );
        const o = bx.querySelector(".oth");
        if (o) o.hidden = !v.includes("Autre");
      }
      function vis() {
        S[step].q.forEach((x) => {
          const b = box(x.id);
          if (b) b.hidden = !!(x.show && !x.show(A));
        });
      }
      function head() {
        $("#pt").textContent =
          step >= 0 && step < N
            ? `Section ${step + 1} sur ${N}`
            : step >= N
              ? "Terminé"
              : "";
        $("#pb").style.width =
          (step < 0 ? 0 : (Math.min(step + 1, N) / N) * 100) + "%";
      }
      function render() {
        app.classList.remove("in");
        void app.offsetWidth;
        app.classList.add("in");
        head();
        window.scrollTo(0, 0);
        if (step < 0) {
          app.innerHTML = `<div class="rings"><i></i><i></i></div><h1>Comprendre les besoins des créateurs et construire Linkaro avec eux</h1><p class="lead">Linkaro aide les créateurs de contenu à mieux développer et gérer leurs collaborations avec les marques et entreprises.</p><p class="mut">Avant de définir le produit, nous voulons comprendre votre activité, les difficultés que vous rencontrez réellement et la manière dont vous aimeriez être accompagné. Il n'y a pas de bonne ou de mauvaise réponse. Comptez 8 à 10 minutes.</p><div class="nav"><button class="btn" id="go">${Object.keys(A).length ? "Reprendre" : "Commencer"}</button></div>`;
          $("#go").onclick = () => {
            step = 0;
            sv();
            render();
          };
          return;
        }
        const s = S[step];
        app.innerHTML = `${s.t ? `<h2>${s.t}</h2>` : ""}${s.intro ? `<p class="mut">${s.intro}</p>` : ""}${s.q.map(qHTML).join("")}<div class="nav"><button class="btn ghost" id="bk">Retour</button><button class="btn" id="nx">${step == N - 1 ? "Envoyer mes réponses" : "Continuer"}</button></div>`;
        s.q.forEach((x) => refresh(x.id));
        vis();
        $("#bk").onclick = () => {
          step--;
          sv();
          render();
        };
        $("#nx").onclick = () => {
          if (!check()) return;
          if (step == N - 1) submit();
          else {
            step++;
            sv();
            render();
          }
        };
      }
      app.addEventListener("input", (e) => {
        const t = e.target,
          bx = t.closest(".q");
        if (!bx) return;
        const id = bx.dataset.id;
        if (t.tagName == "TEXTAREA") A[id] = t.value;
        else if (t.classList.contains("oth")) A[id + "_autre"] = t.value;
        sv();
      });
      app.addEventListener("change", (e) => {
        const t = e.target,
          bx = t.closest(".q");
        if (!bx || t.type == "text") return;
        const id = bx.dataset.id,
          x = Q[id];
        if (x.type == U) A[id] = t.value;
        else {
          let v = [...bx.querySelectorAll("input[type=checkbox]:checked")].map(
            (i) => i.value,
          );
          if (t.checked && t.dataset.ex == "1") v = [t.value];
          else if (t.checked) {
            const ex = x.opts.filter((o) => o[0] == "!").map((o) => o.slice(1));
            v = v.filter((i) => !ex.includes(i));
          }
          A[id] = v;
        }
        bx.querySelector(".err").textContent = "";
        refresh(id);
        vis();
        sv();
        const o = bx.querySelector(".oth");
        if (o && !o.hidden && t.value == "Autre") o.focus();
      });
      function check() {
        let bad = null;
        S[step].q.forEach((x) => {
          const b = box(x.id);
          if (b.hidden || x.type == T) return;
          const v = [].concat(A[x.id] || []);
          let m = "";
          if (!v.length) m = "Choisissez une réponse pour continuer.";
          else if (v.includes("Autre") && !(A[x.id + "_autre"] || "").trim())
            m = "Précisez votre réponse « Autre ».";
          b.querySelector(".err").textContent = m;
          if (m && !bad) bad = b;
        });
        if (bad) bad.scrollIntoView({ behavior: "smooth", block: "center" });
        return !bad;
      }
      async function hashIpAndUserAgent() {
        if (!window.crypto?.subtle) throw new Error("Web Crypto indisponible");
        const response = await fetch("https://api.ipify.org?format=json");
        if (!response.ok) throw new Error("Adresse IP indisponible");
        const { ip } = await response.json();
        if (!ip) throw new Error("Adresse IP indisponible");
        const data = new TextEncoder().encode(`${ip}|${navigator.userAgent}`);
        const digest = await crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(digest), (byte) =>
          byte.toString(16).padStart(2, "0"),
        ).join("");
      }
      async function submit() {
        let empreinte;
        try {
          empreinte = await hashIpAndUserAgent();
        } catch (e) {
          alert(
            "Impossible de générer l'identifiant de cette réponse. Vérifiez votre connexion puis réessayez.",
          );
          return;
        }
        $("#empreinte-ip-ua").value = empreinte;
        const out = {
          envoye_le: new Date().toISOString(),
          empreinte_ip_ua_sha256: $("#empreinte-ip-ua").value,
          reponses: {},
        };
        S.forEach((s) =>
          s.q.forEach((x) => {
            if (x.show && !x.show(A)) return;
            const v = A[x.id];
            if (v == null || !v.length) return;
            const r = { question: x.t, reponse: v };
            if ([].concat(v).includes("Autre") && A[x.id + "_autre"])
              r.autre = A[x.id + "_autre"].trim();
            out.reponses[x.id] = r;
          }),
        );
        if (ENDPOINT) {
          try {
            await fetch(ENDPOINT, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(out),
            });
          } catch (e) {}
        }
        try {
          const all = JSON.parse(localStorage.getItem("lk_all") || "[]");
          all.push(out);
          localStorage.setItem("lk_all", JSON.stringify(all));
          localStorage.removeItem("lk_a");
          localStorage.removeItem("lk_s");
        } catch (e) {}
        A = {};
        step = N;
        head();
        window.scrollTo(0, 0);
        app.innerHTML = `<div class="rings"><i></i><i></i></div><h1>Merci pour vos réponses</h1><p class="lead">Ce questionnaire sert à construire Linkaro à partir de la réalité des créateurs, et non uniquement d'hypothèses.</p><p class="mut">Vos réponses nous aideront à définir les fonctionnalités prioritaires, la manière dont Linkaro doit vous accompagner et jusqu'où la plateforme doit aller.</p><div class="nav"><button class="btn ghost" id="nw">Nouvelle réponse</button></div>`;
        $("#nw").onclick = () => {
          step = -1;
          render();
        };
      }
      render();
    </script>
  </body>
</html>
