name: Release

# Déclenchée par un tag de version : v0.1.0 (release) ou v0.1.0-test.1 (pré-release).
#   git tag v0.1.0-test.1 && git push origin v0.1.0-test.1
# Produit, dans la page « Releases » du dépôt, une archive autonome par application
# (web, admin, worker) : serveur + dépendances + fichiers statiques, sans pnpm ni npm à installer.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # créer la release et y joindre les archives

jobs:
  release:
    name: Construire, vérifier et publier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKIP_ENV_VALIDATION: "1"
      # Même version que le serveur de test (PostgreSQL 10) : les tests d'intégration
      # et les migrations sont rejoués dessus avant toute publication.
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:10
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Contrôles qualité
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build de production
        run: pnpm build

      - name: Empaqueter les applications
        run: node scripts/package-release.mjs "$GITHUB_REF_NAME"

      # Les archives sont décompressées dans un dossier vide et démarrées en production :
      # migrations, santé, fichiers statiques, worker, lien d'invitation du premier superadmin.
      - name: Vérifier les archives (démarrage réel sur PostgreSQL 10)
        env:
          PGPASSWORD: postgres
          SMOKE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/linkaro_smoke?schema=public
        run: |
          psql -h localhost -U postgres -c 'CREATE DATABASE linkaro_smoke'
          node scripts/smoke-release.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: linkaro-${{ github.ref_name }}
          path: |
            release/*.tar.gz
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          # Un tiret dans le tag (v0.1.0-test.1) = pré-release.
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/SHA256SUMS.txt \
            --title "Linkaro $GITHUB_REF_NAME" --generate-notes $flags
